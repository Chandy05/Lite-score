<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chandy Calculator</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: rgba(13, 27, 42, 0.95); 
            font-family: 'Courier New', Courier, monospace; 
            height: 100vh;
            /* แก้ให้จัดเรียงจากบนลงล่าง ป้องกันคีย์บอร์ดบัง */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; /* เริ่มจากบนสุด */
            overflow: hidden; 
        }
        
        /* กล่องบน: แสดงผลลัพธ์ใหญ่ๆ (ให้อยู่บนสุดเสมอ) */
        .preview-container {
            width: 100%;
            height: 45vh; /* บังคับความสูงให้ตายตัว */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        #previewText { 
            font-size: clamp(30px, 12vw, 150px); /* ปรับขนาดออโต้ไม่ให้ล้นจอ */
            font-weight: 900; 
            line-height: 1.2; 
            text-align: center; 
            word-break: break-word;
            margin: 0;
            padding: 0;
        }

        /* ตกแต่งสีสันพิเศษ */
        .color-hit { color: #00ff00; text-shadow: 0 0 25px rgba(0,255,0,0.8); }
        .color-miss { color: #ff3333; text-shadow: 0 0 25px rgba(255,51,51,0.8); }
        .color-score { color: #00e5ff; text-shadow: 0 0 25px rgba(0, 229, 255, 0.8); }
        .plus-sign { color: #fff; margin: 0 10px; opacity: 0.5; font-size: 0.8em; }

        /* กล่องล่าง: สำหรับพิมพ์ค่า (ให้อยู่ถัดลงมา) */
        .input-container {
            width: 95%;
            max-width: 800px;
            margin-top: 2vh; /* ดันลงมาจากจอแสดงผลลัพธ์เล็กน้อย */
        }

        .input-wrapper { 
            background: #fff; 
            padding: 5px; 
            border-radius: 12px; 
            border: 6px solid #00e5ff; 
            width: 100%; 
            box-sizing: border-box; 
            box-shadow: 0 0 20px rgba(0,229,255,0.6); 
        }

        #rapidInput { 
            font-size: clamp(30px, 8vw, 60px);
            height: 12vh; /* ปรับให้สูงขึ้นนิดนึงพิมพ์ง่าย */
            min-height: 60px;
            width: 100%; 
            text-align: center; 
            font-weight: bold; 
            border: none; 
            outline: none; 
            background: transparent; 
            color: #000; 
            text-transform: uppercase; 
            font-family: 'Courier New', Courier, monospace; 
        }
    </style>
</head>
<body>

    <!-- กล่องโชว์ผลลัพธ์ยักษ์ (จัดให้อยู่ด้านบน) -->
    <div class="preview-container">
        <div id="previewText"></div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="rapidInput" autocomplete="off" autofocus>
        </div>
    </div>

    for(let p in rawCSV){
        let l = rawCSV[p].trim().split('\n');
        for(let i=0; i<l.length; i++){
            let c = l[i].split(',');
            let y = parseInt(c[0]);
            if(c[0]==="" && c[1]==="HIT") y=0;
            if(isNaN(y)) continue;
            if(!db[p][y]) db[p][y] = {};
            for(let x=0; x<=85; x+=5){
                let v = c[(x/5)+1] ? c[(x/5)+1].trim() : "";
                v = v.replace(/^(\d+)\s+(\d+)$/g, '$1/$2');
                db[p][y][x] = v;
            }
        }
    }

    // 2. ฟังก์ชันวิเคราะห์ค่าย้ายแกน
    function parseGridValue(s) { 
        if(!s) return {val:0, dir:''}; 
        let r = s.trim().toUpperCase(); 
        if(r==='0' || r==='00' || r==='HIT') return {val:0, dir:''}; 
        let v = parseFloat(r.replace(/[^\d.]/g,'')); 
        if(isNaN(v)) return {val:0, dir:''}; 
        return {val:v, dir:r.includes('L')?'L':(r.includes('R')?'R':'')}; 
    }

    // 3. ฟังก์ชันประเมินผล (แปลงพิกัดกริดเดี่ยวๆ)
    function parseScore(iv) {
        let c = iv.toUpperCase().trim();
        if(c.includes('N/S') || c.includes('-')) return 'N/S';
        if(c.includes('99')) c = c.replace(/99/g, 'OUT/');
        let mOut = c.match(/OUT\/\d*/);
        if (mOut) return mOut[0];
        if(c==='00' || c==='0 0' || c==='HIT') return 'HIT';
        if(c==='0') return '0';
        if(c.includes('D') && !c.includes('OUT') && !c.includes('N/S')) return 'D';

        if(/^\d+$/.test(c.replace(/\s+/g,'')) || c.includes('/')) return c;

        c = c.replace(/^0(?=\d)/g,'0 ').replace(/([LR])0$/g,'$1 0');
        let t = [...c.matchAll(/(00|0|[1-9]\d*[LR]?)/g)];
        if(t && t.length >= 2){
            let l = parseGridValue(t[0][0]), r = parseGridValue(t[1][0]);
            let p = (l.dir===''?'R':l.dir)==='L'?'ซ':'ข', p2 = (r.dir===''?'R':r.dir)==='L'?'ซ':'ข';
            let y = Math.abs(l.val).toString(), x = Math.abs(r.val).toString();
            if(db[p+p2] && db[p+p2][y] && db[p+p2][y][x]) return db[p+p2][y][x];
        }
        return "?";
    }

    // 4. ระบบจับคู่การพิมพ์ (ลอกมาจากระบบหลักเป๊ะๆ)
    function parseInputString(str) {
        let d = [], iM = false;
        let separatorRegex = /\s*\|\s*/;
        
        if(separatorRegex.test(str)){
            iM = true; 
            let p = str.split(separatorRegex);
            let lC = p[0].match(/(99(?:1[0-2]|[1-9])?|OUT\/\d*|N\/S|\-|\+|\d+\/\d*|HIT|D|[1-9]\d*[LR]?|0)/g)||[];
            let rC = p[1].match(/(99(?:1[0-2]|[1-9])?|OUT\/\d*|N\/S|\-|\+|\d+\/\d*|HIT|D|[1-9]\d*[LR]?|0)/g)||[];
            let mL = Math.max(lC.length, rC.length);
            
            // จับคู่ตัวซ้ายและขวาตามลำดับ
            for(let i=0; i<mL; i++) {
                d.push(`${lC[i]||'-'} ${rC[i]||'-'}`.replace(/\s{2,}/g,' ').trim());
            }
        } else { 
            if(str.trim() === '+') { d=['+']; iM=false; }
            else { 
                let p = str.split('+').map(s=>s.trim()).filter(s=>s!==""); 
                iM = p.length > 1; 
                d = p; 
            }
        }
        
        if(d.length === 1 && d[0] === "") d = ["D"];
        
        let pD = d.map(r => {
            let v = r; 
            if(v===''||v==='+') v='D'; 
            if(v.includes('99')) v = v.replace(/99/g,'OUT/'); 
            if(v.includes('--')) v = v.replace(/--/g,'OUT/');
            
            let p = ""; 
            if(v.includes('-')||v.includes('N/S')) p="N/S"; 
            else if(v.includes('OUT')){
                let m = v.match(/OUT\/\d*/);
                p = m ? m[0] : "OUT/?";
            } 
            else {
                p = parseScore(v);
            }
            
            return {raw: r, parsed: p};
        }).filter(p => p.parsed !== "" && p.parsed !== "?");
        
        return {parsedDrops: pD, isMulti: iM};
    }

    // 5. ระบบรับค่าและแสดงผล
    const rapidInput = document.getElementById('rapidInput');
    const preview = document.getElementById('previewText');

    rapidInput.addEventListener('input', function() {
        let raw = this.value.toUpperCase();
        
        // กฎการแปลงค่า (รองรับวงเล็บแบบที่ขอ)
        raw = raw.replace(/\./g, '|'); // แยก drop (multi)
        raw = raw.replace(/\//g, 'L');
        raw = raw.replace(/\*/g, 'R');
        raw = raw.replace(/\(/g, 'L'); // ( = ซ้าย
        raw = raw.replace(/\)/g, 'R'); // ) = ขวา
        
        let tokens = raw.match(/(99(?:1[0-2]|[1-9])?|OUT\/\d*|HIT|N\/S|D|\-|\+|\d+\/\d*|0|[1-9]\d*[LR]?|\|)/gi) || [];
        let rV = tokens.join(' ');
        this.value = rV;

        if(!rV.trim()){ 
            preview.innerHTML = ''; 
            return; 
        }

        // โยนเข้าสมองกลตัวเต็ม (ตัวเดียวกับระบบหลัก)
        let R = parseInputString(rV);

        if (R.parsedDrops.length > 0) {
            // นำผลลัพธ์มาจัดเรียงสีสัน
            let visualResult = R.parsedDrops.map(x => {
                let p = x.parsed;
                if(p.includes('HIT')) return '<span class="color-hit">HIT</span>';
                if(p.includes('N/S')) return '<span class="color-miss">N/S</span>';
                if(p.includes('OUT')) return p.replace(/OUT\/\d*/g, '<span class="color-miss">$&</span>');
                return `<span class="color-score">${p}</span>`;
            }).join(' <span class="plus-sign">|</span> ');
            
            preview.innerHTML = visualResult;
        } else {
            preview.innerHTML = '';
        }
    });

    rapidInput.addEventListener('keydown', function(e) {
        if(e.key === 'Enter') {
            // ล้างหน้าจอเมื่อกด Enter
            this.value = '';
            preview.innerHTML = '';
        }
    });

    rapidInput.focus();

</script>
