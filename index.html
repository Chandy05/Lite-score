<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chandy Calc">
    <meta name="theme-color" content="#0d1b2a">
    
    <title>Chandy Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            margin: 0;
            padding: max(env(safe-area-inset-top), 8px) 12px max(env(safe-area-inset-bottom), 10px) 12px;
            background: #0d1b2a; 
            font-family: 'Courier New', Courier, monospace; 
            height: 100dvh;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            overflow: hidden; 
            overscroll-behavior-y: none;
        }

        /* แถบประวัติย้อนหลัง (แสดงเป็น 5L 10R = 35/1 หรือคั่นด้วย , เมื่อมีหลายลูก) */
        .history-bar {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            min-height: 32px;
            padding: 2px 0;
            scrollbar-width: none;
            align-items: center;
        }
        .history-bar::-webkit-scrollbar { display: none; }
        .history-pill {
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(144, 224, 239, 0.3);
            color: #90e0ef;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 999px;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
        }
        .history-pill:first-child {
            background: rgba(0, 229, 255, 0.18);
            border-color: #00e5ff;
            color: #ffffff;
        }
        .history-pill:active {
            background: #00e5ff;
            color: #000;
        }
        
        /* ส่วนบน: แสดงผลลัพธ์ขนาดใหญ่ */
        .preview-container {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            min-height: 0;
            overflow-y: auto;
        }

        #previewText { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2vh, 16px);
            font-size: clamp(40px, 14vw, 108px);
            font-weight: 900; 
            line-height: 1; 
            text-align: center; 
            width: 100%;
        }

        .color-hit { color: #00ff00; text-shadow: 0 0 28px rgba(0,255,0,0.85); }
        .color-miss { color: #ff3333; text-shadow: 0 0 28px rgba(255,51,51,0.85); }
        .color-score { color: #00e5ff; text-shadow: 0 0 28px rgba(0, 229, 255, 0.85); }

        /* ส่วนควบคุมด้านล่าง */
        .bottom-panel {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.3vh, 12px);
            padding-bottom: 4px;
        }

        /* แถบสถานะการรับเสียง + ปุ่ม Undo + สวิตช์เปิดโหมดสอนคำ */
        .status-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
            width: 100%;
        }

        .voice-status-box {
            flex: 1;
            min-height: 42px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 10px;
            color: #90e0ef;
            font-family: -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
            font-size: clamp(13px, 3.6vw, 15px);
            line-height: 1.3;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 8px;
            word-break: break-word;
        }

        .undo-btn {
            display: none;
            background: #ffb703;
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .teach-toggle-btn {
            background: #1b263b;
            border: 1px solid #415a77;
            color: #cbd5e1;
            border-radius: 10px;
            padding: 0 12px;
            font-family: -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .teach-toggle-btn.open {
            background: #00e5ff;
            color: #000;
            border-color: #00e5ff;
        }

        /* กล่องกรอกรหัส + แถบนับถอยหลัง 5 วินาที */
        .input-wrapper { 
            position: relative;
            background: #fff; 
            padding: 4px 12px; 
            border-radius: 14px; 
            border: 5px solid #00e5ff; 
            width: 100%; 
            box-shadow: 0 0 18px rgba(0,229,255,0.45); 
            transition: border-color 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .input-wrapper.listening-border {
            border-color: #00ff88;
            box-shadow: 0 0 22px rgba(0, 255, 136, 0.7);
        }

        .auto-clear-bar {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 4px;
            width: 0%;
            background: #f59e0b;
            pointer-events: none;
        }

        #rapidInput { 
            font-size: clamp(24px, 7.5vw, 46px);
            height: clamp(50px, 7.5vh, 66px);
            width: 100%; 
            text-align: center; 
            font-weight: bold; 
            border: none; 
            outline: none; 
            background: transparent; 
            color: #000; 
            text-transform: uppercase; 
            font-family: 'Courier New', Courier, monospace; 
        }

        /* แถวปุ่มควบคุมหลัก: เปิดไมค์ | เคลียร์ | คาลิเบรต */
        .controls-row {
            display: grid;
            grid-template-columns: 1.8fr 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .btn {
            border: none;
            padding: clamp(11px, 1.8vh, 15px) 8px;
            font-size: clamp(14px, 3.8vw, 16px);
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .mic-btn {
            background: #e63946;
            color: #fff;
        }
        .mic-btn.active {
            background: #00c853;
            box-shadow: 0 0 16px rgba(0, 200, 83, 0.65);
        }
        .clear-main-btn {
            background: #f59e0b;
            color: #000;
        }
        .clear-main-btn:active { background: #d97706; }

        .cal-btn {
            background: #2b3d54;
            color: #e0e1dd;
            border: 1px solid #415a77;
        }
        .cal-btn:active { background: #415a77; }

        /* แถบปุ่มสอนคำด่วน (ซ่อนไว้เป็นค่าเริ่มต้น) */
        .quick-teach-bar {
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
            padding-top: 2px;
        }
        .quick-teach-bar.show {
            display: grid;
        }
        .teach-chip {
            background: #1b263b;
            border: 1px solid #415a77;
            color: #cbd5e1;
            padding: 9px 2px;
            border-radius: 8px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
            font-size: clamp(11px, 3vw, 13px);
            font-weight: bold;
            text-align: center;
        }
        .teach-chip:active {
            background: #00e5ff;
            color: #000;
        }

        @media (max-height: 680px) {
            #previewText { font-size: clamp(32px, 11vw, 72px); }
            .voice-status-box { min-height: 36px; padding: 6px 10px; }
        }

        /* Modal คาลิเบรตเสียง */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #1b263b;
            color: #fff;
            width: 100%;
            max-width: 560px;
            border-radius: 14px;
            padding: 18px;
            border: 2px solid #00e5ff;
            max-height: 85dvh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #415a77;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .modal-header h3 { margin: 0; color: #00e5ff; font-size: 17px; }
        .cal-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 10px;
        }
        .cal-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cal-label { font-weight: bold; font-size: 14px; color: #e0e1dd; }
        .cal-input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #415a77;
            background: #0d1b2a;
            color: #00ff88;
            font-size: 14px;
        }
        .record-cal-btn {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .record-cal-btn.recording { background: #ffb703; color: #000; }
        .modal-footer {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #415a77;
        }
    </style>
</head>
<body>

    <!-- ประวัติล่าสุด (แสดงเป็น 5L 10R = 35/1 หรือคั่นด้วย , เมื่อมีหลายลูก) -->
    <div id="historyBar" class="history-bar"></div>

    <!-- ส่วนบน: แสดงผลลัพธ์ -->
    <div class="preview-container">
        <div id="previewText"></div>
    </div>

    <!-- ส่วนล่าง: สถานะเสียง + ช่องกรอก + ปุ่มควบคุม -->
    <div class="bottom-panel">
        <div class="status-row">
            <div class="voice-status-box">
                <span id="voiceStatusText">กดปุ่มเปิดไมค์เพื่อเริ่มสั่งงานด้วยเสียง</span>
                <button id="undoTeachBtn" class="undo-btn" type="button">↩️ เลิกทำ</button>
            </div>
            <button id="toggleTeachBarBtn" class="teach-toggle-btn" type="button" title="เปิด/ปิดปุ่มสอนคำด่วน">🎓 สอนคำ</button>
        </div>

        <div id="inputBoxWrapper" class="input-wrapper">
            <input type="text" id="rapidInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="พูดหรือพิมพ์...">
            <div id="autoClearBar" class="auto-clear-bar"></div>
        </div>

        <!-- แถวปุ่มหลัก: เปิดไมค์ | เคลียร์ | คาลิเบรต -->
        <div class="controls-row">
            <button id="micToggleBtn" class="btn mic-btn" type="button">🎤 เปิดไมค์</button>
            <button id="clearMainBtn" class="btn clear-main-btn" type="button">🧹 เคลียร์</button>
            <button id="openCalBtn" class="btn cal-btn" type="button">⚙️ คาลิเบรต</button>
        </div>

        <!-- แถบสอนคำด่วน (ซ่อนอยู่เป็นค่าเริ่มต้น) -->
        <div id="quickTeachBar" class="quick-teach-bar">
            <button class="teach-chip" type="button" data-teach="OUT">+ OUT</button>
            <button class="teach-chip" type="button" data-teach="NS">+ N/S</button>
            <button class="teach-chip" type="button" data-teach="DRY">+ DRY</button>
            <button class="teach-chip" type="button" data-teach="HIT">+ HIT</button>
            <button class="teach-chip" type="button" data-teach="CLEAR">+ เคลียร์</button>
        </div>
    </div>

    <!-- Modal คาลิเบรตเสียง -->
    <div id="calModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>⚙️ คาลิเบรตเสียงพูด</h3>
                <button id="closeCalBtn" class="btn" style="background:#415a77;color:#fff;padding:6px 12px;font-size:14px;">✕ ปิด</button>
            </div>
            <div id="calRowsContainer"></div>
            <div class="modal-footer">
                <button id="resetCalBtn" class="btn" style="background:#6c757d;color:#fff;padding:10px 14px;font-size:14px;">คืนค่าเริ่มต้น</button>
                <button id="saveCalBtn" class="btn" style="background:#00c853;color:#fff;padding:10px 18px;font-size:14px;">💾 บันทึก</button>
            </div>
        </div>
    </div>

    const db = {"ขข":{},"ขซ":{},"ซซ":{},"ซข":{}};
    for(let p in rawCSV){
        let l = rawCSV[p].trim().split('\n');
        for(let i=0; i<l.length; i++){
            let c = l[i].split(',');
            let y = parseInt(c[0]);
            if(c[0]==="" && c[1]==="HIT") y=0;
            if(isNaN(y)) continue;
            if(!db[p][y]) db[p][y] = {};
            for(let x=0; x<=85; x+=5){
                let v = c[(x/5)+1] ? c[(x/5)+1].trim() : "";
                v = v.replace(/^(\d+)\s+(\d+)$/g, '$1/$2');
                db[p][y][x] = v;
            }
        }
    }

    function parseGridValue(s) { 
        if(!s) return {val:0, dir:''}; 
        let r = s.trim().toUpperCase(); 
        if(r==='0' || r==='00' || r==='HIT') return {val:0, dir:''}; 
        let v = parseFloat(r.replace(/[^\d.]/g,'')); 
        if(isNaN(v)) return {val:0, dir:''}; 
        return {val:v, dir:r.includes('L')?'L':(r.includes('R')?'R':'')}; 
    }

    function parseScore(iv) {
        let c = iv.toUpperCase().trim();
        if(c.includes('N/S') || c.includes('-')) return 'N/S';
        if(c.includes('99')) c = c.replace(/99/g, 'OUT/');
        let mOut = c.match(/OUT\/\d*/);
        if (mOut) return mOut[0];
        if(c==='00' || c==='0 0' || c==='HIT') return 'HIT';
        if(c==='0') return '0';
        if(c.includes('D') && !c.includes('OUT') && !c.includes('N/S')) return 'D';

        if(/^\d+$/.test(c.replace(/\s+/g,'')) || c.includes('/')) return c;

        c = c.replace(/^0(?=\d)/g,'0 ').replace(/([LR])0$/g,'$1 0');
        let t = [...c.matchAll(/(00|0|[1-9]\d*[LR]?)/g)];
        if(t && t.length >= 2){
            let l = parseGridValue(t[0][0]), r = parseGridValue(t[1][0]);
            let p = (l.dir===''?'R':l.dir)==='L'?'ซ':'ข', p2 = (r.dir===''?'R':r.dir)==='L'?'ซ':'ข';
            let y = Math.abs(l.val).toString(), x = Math.abs(r.val).toString();
            if(db[p+p2] && db[p+p2][y] && db[p+p2][y][x]) return db[p+p2][y][x];
        }
        return "?";
    }

    function parseInputString(str) {
        let d = [], iM = false;
        let separatorRegex = /\s*\|\s*/;
        
        if(separatorRegex.test(str)){
            iM = true; 
            let p = str.split(separatorRegex);
            let lC = p[0].match(/(99(?:1[0-2]|[1-9])?|OUT\/\d*|N\/S|\-|\+|\d+\/\d*|HIT|D|[1-9]\d*[LR]?|0)/g)||[];
            let rC = p[1].match(/(99(?:1[0-2]|[1-9])?|OUT\/\d*|N\/S|\-|\+|\d+\/\d*|HIT|D|[1-9]\d*[LR]?|0)/g)||[];
            let mL = Math.max(lC.length, rC.length);
            for(let i=0; i<mL; i++) {
                d.push(`${lC[i]||'-'} ${rC[i]||'-'}`.replace(/\s{2,}/g,' ').trim());
            }
        } else { 
            if(str.trim() === '+') { d=['+']; iM=false; }
            else { 
                let p = str.split('+').map(s=>s.trim()).filter(s=>s!==""); 
                iM = p.length > 1; 
                d = p; 
            }
        }
        
        if(d.length === 1 && d[0] === "") d = ["D"];
        
        let pD = d.map(r => {
            let v = r; 
            if(v===''||v==='+') v='D'; 
            if(v.includes('99')) v = v.replace(/99/g,'OUT/'); 
            if(v.includes('--')) v = v.replace(/--/g,'OUT/');
            
            let p = ""; 
            if(v.includes('-')||v.includes('N/S')) p="N/S"; 
            else if(v.includes('OUT')){
                let m = v.match(/OUT\/\d*/);
                p = m ? m[0] : "OUT/?";
            } 
            else {
                p = parseScore(v);
            }
            return {raw: r, parsed: p};
        }).filter(p => p.parsed !== "" && p.parsed !== "?");
        
        return {parsedDrops: pD, isMulti: iM};
    }

    const rapidInput = document.getElementById('rapidInput');
    const preview = document.getElementById('previewText');
    const historyBar = document.getElementById('historyBar');
    const autoClearBar = document.getElementById('autoClearBar');

    const AUTO_CLEAR_MS = 5000; // เคลียร์ช่อง rapidInput อัตโนมัติเมื่อผ่านไป 5 วินาที
    let autoClearTimer = null;
    let recentHistory = [];
    let currentParsedList = [];

    function cancelAutoClearTimer() {
        if (autoClearTimer) {
            clearTimeout(autoClearTimer);
            autoClearTimer = null;
        }
        autoClearBar.style.transition = 'none';
        autoClearBar.style.width = '0%';
    }

    function resetAutoClearTimer() {
        cancelAutoClearTimer();
        if (!rapidInput.value.trim()) return;

        // แสดงแถบนับถอยหลัง 5 วินาทีใต้ช่องกรอก
        autoClearBar.style.width = '100%';
        void autoClearBar.offsetWidth; // force reflow
        autoClearBar.style.transition = `width ${AUTO_CLEAR_MS}ms linear`;
        autoClearBar.style.width = '0%';

        autoClearTimer = setTimeout(() => {
            clearRapidInput(true);
        }, AUTO_CLEAR_MS);
    }

    function pushToHistory(rawCode, parsedArray) {
        if (!rawCode || !parsedArray || parsedArray.length === 0) return;
        const resultStr = parsedArray.join(', ');
        const fullLabel = `${rawCode} = ${resultStr}`;
        if (recentHistory.length > 0 && recentHistory[0].label === fullLabel) return;
        recentHistory.unshift({ raw: rawCode, label: fullLabel });
        if (recentHistory.length > 8) recentHistory.pop();
        renderHistoryBar();
    }

    function renderHistoryBar() {
        historyBar.innerHTML = recentHistory.map((item, idx) =>
            `<button type="button" class="history-pill" data-idx="${idx}">${item.label}</button>`
        ).join('');
        historyBar.querySelectorAll('.history-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                const item = recentHistory[parseInt(btn.dataset.idx, 10)];
                if (item) {
                    rapidInput.value = item.raw;
                    processRapidInput();
                }
            });
        });
    }

    function clearRapidInput(isAuto = false) {
        cancelAutoClearTimer();
        const currentRaw = rapidInput.value.trim();
        if (currentRaw && currentParsedList.length > 0) {
            pushToHistory(currentRaw, currentParsedList);
        }
        rapidInput.value = '';
        preview.innerHTML = '';
        currentParsedList = [];
        if (isAuto) {
            setStatusMessage('เคลียร์ช่องอัตโนมัติ (ครบ 5 วินาที)');
        }
    }

    function processRapidInput() {
        let raw = rapidInput.value.toUpperCase();
        raw = raw.replace(/\./g, '|');
        raw = raw.replace(/\(/g, 'L');
        raw = raw.replace(/\)/g, 'R');
        
        let tokens = raw.match(/(99(?:1[0-2]|[1-9])?|OUT\/\d*|HIT|N\/S|D|\-|\+|\d+\/\d*|0|[1-9]\d*[LR]?|\|)/gi) || [];
        let rV = tokens.join(' ');
        rapidInput.value = rV;

        if(!rV.trim()){ 
            preview.innerHTML = ''; 
            currentParsedList = [];
            cancelAutoClearTimer();
            return; 
        }

        let R = parseInputString(rV);
        if (R.parsedDrops.length > 0) {
            currentParsedList = R.parsedDrops.map(x => x.parsed);
            preview.innerHTML = R.parsedDrops.map(x => {
                let p = x.parsed;
                if(p.includes('HIT')) return '<div class="color-hit">HIT</div>';
                if(p.includes('N/S')) return '<div class="color-miss">N/S</div>';
                if(p.includes('OUT')) return `<div class="color-miss">${p}</div>`;
                return `<div class="color-score">${p}</div>`;
            }).join('');
        } else {
            preview.innerHTML = '';
            currentParsedList = [];
        }

        // เริ่มนับถอยหลัง 5 วินาทีใหม่ทุกครั้งที่มีการอัปเดตค่า
        resetAutoClearTimer();
    }

    rapidInput.addEventListener('input', processRapidInput);
    rapidInput.addEventListener('keydown', function(e) {
        if(e.key === 'Enter') {
            clearRapidInput(false);
        }
    });

    document.getElementById('clearMainBtn').addEventListener('click', () => {
        clearRapidInput(false);
        setStatusMessage('ล้างช่องกรอกแล้ว');
    });

        PIPE:  ["จุด", "สุด", "ขุด", "หลุด", "หยุด", "คั่น"],
        DIR:   ["ทิศ", "ทิด", "พิษ", "ชิด", "ที่", "ที", "ทับ", "สแลช"],
        LEFT:  ["ซ้าย", "สาย", "ทราย", "ชาย", "ไซส์"],
        RIGHT: ["ขวา", "ฝา", "ขา", "ฟ้า", "กว่า", "ขวาง"]
    };

    const calConfigMeta = [
        { key: 'OUT',   title: 'เอาท์ทิศ... (OUT/)' },
        { key: 'NS',    title: 'โนสะปาร์ค (N/S)' },
        { key: 'DRY',   title: 'ดราย (D)' },
        { key: 'HIT',   title: 'ฮิต (HIT)' },
        { key: 'DIR',   title: 'ทิศ / ทับ (/)' },
        { key: 'LEFT',  title: 'ซ้าย (L)' },
        { key: 'RIGHT', title: 'ขวา (R)' },
        { key: 'PIPE',  title: 'จุด (|)' },
        { key: 'CLEAR', title: 'เคลียร์ (ล้างจอ)' }
    ];

    function sanitizeDict(dictObj) {
        const cleaned = {};
        for (let k in defaultVoiceDict) {
            const list = Array.isArray(dictObj[k]) ? dictObj[k] : defaultVoiceDict[k];
            cleaned[k] = Array.from(new Set(
                list.map(w => w.trim()).filter(w => w && !/\d/.test(w))
            ));
        }
        return cleaned;
    }

    function loadVoiceDict() {
        try {
            const saved = localStorage.getItem('chandy_voice_dict_v4');
            if (saved) {
                let parsed = JSON.parse(saved);
                let merged = {};
                for (let k in defaultVoiceDict) {
                    merged[k] = Array.from(new Set([...(parsed[k] || []), ...defaultVoiceDict[k]]));
                }
                const clean = sanitizeDict(merged);
                localStorage.setItem('chandy_voice_dict_v4', JSON.stringify(clean));
                return clean;
            }
        } catch(e) {}
        return JSON.parse(JSON.stringify(defaultVoiceDict));
    }

    let voiceDict = loadVoiceDict();

    // ==========================================
    // 3. แปลงตัวเลขภาษาไทยเป็นอารบิก
    // ==========================================
    const thaiDigitMap = {
        'ศูนย์':0, 'หนึ่ง':1, 'เอ็ด':1, 'สอง':2, 'ยี่':2, 'สาม':3, 'สี่':4,
        'ห้า':5, 'หก':6, 'เจ็ด':7, 'แปด':8, 'เก้า':9
    };

    function parseThaiNumberWord(word) {
        let total = 0;
        let rem = word;
        let m100 = rem.match(/^(หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)?ร้อย/);
        if (m100) {
            total += (m100[1] ? thaiDigitMap[m100[1]] : 1) * 100;
            rem = rem.slice(m100[0].length);
        }
        let m10 = rem.match(/^(ยี่|หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)?สิบ/);
        if (m10) {
            total += (m10[1] ? thaiDigitMap[m10[1]] : 1) * 10;
            rem = rem.slice(m10[0].length);
        }
        if (rem && thaiDigitMap.hasOwnProperty(rem)) {
            total += thaiDigitMap[rem];
        }
        return total;
    }

    function convertAllThaiNumbers(text) {
        const thDigits = ['๐','๑','๒','๓','๔','๕','๖','๗','๘','๙'];
        thDigits.forEach((d, idx) => { text = text.replace(new RegExp(d, 'g'), idx.toString()); });

        const numPattern = /(?:(?:หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)?ร้อย(?:(?:ยี่|หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)?สิบ)?(?:หนึ่ง|เอ็ด|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)?|(?:ยี่|หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)?สิบ(?:หนึ่ง|เอ็ด|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)?|ศูนย์|หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)/g;
        return text.replace(numPattern, (match) => ` ${parseThaiNumberWord(match)} `);
    }

    function escapeRegex(str) {
        return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function buildRegexFromList(list) {
        const sorted = [...list].map(s => s.trim()).filter(Boolean).sort((a,b) => b.length - a.length);
        return sorted.map(escapeRegex).join('|');
    }

    // ==========================================
    // 4. ตัวแปลคำสั่งเสียง
    // ==========================================
    function parseVoiceToChandyCode(transcript) {
        let s = transcript.trim().toLowerCase();
        let compact = s.replace(/\s+/g, '');

        if (new RegExp(buildRegexFromList(voiceDict.CLEAR), 'i').test(compact)) {
            return { isClear: true, code: '' };
        }

        s = s.replace(new RegExp(buildRegexFromList(voiceDict.NS), 'gi'), ' N/S ');
        s = convertAllThaiNumbers(s);

        const dirWords = buildRegexFromList(voiceDict.DIR);
        const outWords = buildRegexFromList(voiceDict.OUT);
        const leftWords = buildRegexFromList(voiceDict.LEFT);
        const rightWords = buildRegexFromList(voiceDict.RIGHT);

        s = s.replace(new RegExp(`(\\d+)\\s*(?:${dirWords}|\\/)\\s*(1[0-2]|[1-9])(?!\\d)`, 'gi'), ' $1/$2 ');
        s = s.replace(new RegExp(`(?:^|\\s)(?:${outWords})\\s*(?:${dirWords})?\\s*(1[0-2]|[1-9])(?!\\d)`, 'gi'), ' 99$1 ');
        s = s.replace(new RegExp(`(?:^|\\s)(?:${dirWords})\\s*(1[0-2]|[1-9])(?!\\d)`, 'gi'), ' /$1 ');
        s = s.replace(new RegExp(`(\\d+)\\s*(?:${leftWords})`, 'gi'), ' $1L ');
        s = s.replace(new RegExp(`(\\d+)\\s*(?:${rightWords})`, 'gi'), ' $1R ');
        s = s.replace(new RegExp(buildRegexFromList(voiceDict.HIT), 'gi'), ' HIT ');
        s = s.replace(new RegExp(buildRegexFromList(voiceDict.DRY), 'gi'), ' D ');
        s = s.replace(new RegExp(buildRegexFromList(voiceDict.PIPE), 'gi'), ' | ');

        let rawTokens = s.match(/(99(?:1[0-2]|[1-9])|OUT\/\d+|HIT|N\/S|D|\||\d+\/\d+|\/\d+|\d+[LR]|\d+)/gi) || [];

        if (rawTokens.length === 1 && /^\d+$/.test(rawTokens[0])) {
            let num = parseInt(rawTokens[0], 10);
            if (num >= 13 && num <= 93 && num % 10 === 3) {
                return { isClear: false, code: `${num - 3}L` };
            }
            let splitSlash = trySplitMergedDistanceClock(rawTokens[0]);
            if (splitSlash) return { isClear: false, code: splitSlash };
            return { isClear: false, code: rawTokens[0] };
        }

        let processedTokens = [];
        for (let i = 0; i < rawTokens.length; i++) {
            let tk = rawTokens[i].toUpperCase();
            if (/^\d+$/.test(tk)) {
                let num = parseInt(tk, 10);
                if (num >= 13 && num <= 94 && (num % 10 === 3 || num % 10 === 4)) {
                    processedTokens.push(`${Math.floor(num / 10) * 10}L`);
                    continue;
                }
                if (num === 53 || num === 54) {
                    processedTokens.push(`5L`);
                    continue;
                }
                if (i + 1 < rawTokens.length && /^\d+$/.test(rawTokens[i + 1])) {
                    let nextNum = parseInt(rawTokens[i + 1], 10);
                    if (num >= 10 && num <= 350 && num % 5 === 0 && nextNum >= 1 && nextNum <= 12) {
                        processedTokens.push(`${num}/${nextNum}`);
                        i++;
                        continue;
                    }
                }
                let splitSlash = trySplitMergedDistanceClock(tk);
                if (splitSlash) {
                    processedTokens.push(splitSlash);
                    continue;
                }
            }
            processedTokens.push(tk);
        }

        return {
            isClear: false,
            code: processedTokens.join(' ').toUpperCase()
        };
    }

    function trySplitMergedDistanceClock(numStr) {
        let fullVal = parseInt(numStr, 10);
        if (fullVal <= 350 && fullVal % 5 === 0) return null;

        if (numStr.length >= 4) {
            let dist2 = parseInt(numStr.slice(0, -2), 10);
            let clk2 = parseInt(numStr.slice(-2), 10);
            if (dist2 >= 10 && dist2 <= 350 && dist2 % 5 === 0 && clk2 >= 10 && clk2 <= 12) {
                return `${dist2}/${clk2}`;
            }
        }
        if (numStr.length >= 3) {
            let dist1 = parseInt(numStr.slice(0, -1), 10);
            let clk1 = parseInt(numStr.slice(-1), 10);
            if (dist1 >= 10 && dist1 <= 350 && dist1 % 5 === 0 && clk1 >= 1 && clk1 <= 9) {
                return `${dist1}/${clk1}`;
            }
        }
        return null;
    }

    function cleanCalibratedWord(rawWord) {
        let w = convertAllThaiNumbers(rawWord).trim().toLowerCase();
        w = w.replace(/\d+/g, '').trim();
        return w.replace(/\s+/g, '');
    }

    function appendCodeToInput(newCode) {
        let current = rapidInput.value.trim();
        if (newCode.startsWith('/') && /\d+$/.test(current)) {
            rapidInput.value = current + newCode;
        } else {
            rapidInput.value = (current + ' ' + newCode).trim();
        }
        processRapidInput();
    }

    // ==========================================
    // 5. Screen Wake Lock (กันหน้าจอมือถือดับตอนเปิดไมค์)
    // ==========================================
    let wakeLock = null;
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (e) {}
    }
    async function releaseWakeLock() {
        try {
            if (wakeLock) {
                await wakeLock.release();
                wakeLock = null;
            }
        } catch (e) {}
    }

    // ==========================================
    // 6. ระบบควบคุมไมโครโฟน + Quick Teach พร้อม Undo
    // ==========================================
    const micToggleBtn = document.getElementById('micToggleBtn');
    const voiceStatusText = document.getElementById('voiceStatusText');
    const undoTeachBtn = document.getElementById('undoTeachBtn');
    const inputBoxWrapper = document.getElementById('inputBoxWrapper');
    const quickTeachBar = document.getElementById('quickTeachBar');
    const toggleTeachBarBtn = document.getElementById('toggleTeachBarBtn');

    let lastTaughtRecord = null;

    function setStatusMessage(msg, showUndo = false) {
        voiceStatusText.textContent = msg;
        undoTeachBtn.style.display = showUndo ? 'inline-block' : 'none';
    }

    toggleTeachBarBtn.addEventListener('click', () => {
        const isOpen = quickTeachBar.classList.toggle('show');
        toggleTeachBarBtn.classList.toggle('open', isOpen);
    });

    undoTeachBtn.addEventListener('click', () => {
        if (!lastTaughtRecord) return;
        const { key, word } = lastTaughtRecord;
        voiceDict[key] = voiceDict[key].filter(w => w !== word);
        localStorage.setItem('chandy_voice_dict_v4', JSON.stringify(voiceDict));
        setStatusMessage(`↩️ ยกเลิกการจำ "${word}" แล้ว`, false);
        lastTaughtRecord = null;
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let calibratingTargetKey = null;
    let lastHeardRawText = '';

    if (!SpeechRecognition) {
        setStatusMessage("เบราว์เซอร์นี้ไม่รองรับการสั่งงานด้วยเสียง");
        micToggleBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'th-TH';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 5;

        let isListening = false;
        let manualStop = true;

        function toggleMicrophone() {
            if (!isListening) {
                manualStop = false;
                try { recognition.start(); } catch(e) {}
            } else {
                manualStop = true;
                recognition.stop();
            }
        }

        micToggleBtn.addEventListener('click', toggleMicrophone);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F2') {
                e.preventDefault();
                toggleMicrophone();
            }
        });

        recognition.onstart = () => {
            isListening = true;
            micToggleBtn.classList.add('active');
            micToggleBtn.textContent = '🟢 กำลังฟัง';
            inputBoxWrapper.classList.add('listening-border');
            setStatusMessage('กำลังฟัง... พูดคำสั่งได้เลย');
            requestWakeLock();
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const res = event.results[i];
                if (!res.isFinal) {
                    interimTranscript += res[0].transcript;
                    continue;
                }

                const primaryTranscript = res[0].transcript.trim();
                if (!primaryTranscript) continue;
                lastHeardRawText = primaryTranscript;

                if (calibratingTargetKey) {
                    const cleaned = cleanCalibratedWord(primaryTranscript);
                    if (cleaned) {
                        addCalibratedWordToInput(calibratingTargetKey, cleaned);
                    }
                    calibratingTargetKey = null;
                    updateCalButtonsUI();
                    continue;
                }

                let bestResult = null;
                let chosenTranscript = primaryTranscript;

                for (let a = 0; a < res.length; a++) {
                    const candidateText = res[a].transcript.trim();
                    const parsed = parseVoiceToChandyCode(candidateText);
                    if (parsed.isClear) {
                        bestResult = parsed;
                        chosenTranscript = candidateText;
                        break;
                    }
                    if (parsed.code && (!bestResult || parsed.code.length > bestResult.code.length)) {
                        bestResult = parsed;
                        chosenTranscript = candidateText;
                    }
                }

                if (bestResult && bestResult.isClear) {
                    clearRapidInput(false);
                    setStatusMessage(`ล้างหน้าจอ ("${chosenTranscript}")`);
                } else if (bestResult && bestResult.code) {
                    appendCodeToInput(bestResult.code);
                    setStatusMessage(`"${chosenTranscript}" ➔ [${bestResult.code}]`);
                } else {
                    setStatusMessage(`ได้ยิน: "${primaryTranscript}"`);
                }
            }

            if (interimTranscript && !calibratingTargetKey) {
                setStatusMessage(`กำลังฟัง: "${interimTranscript}"`);
            }
        };

        recognition.onend = () => {
            if (!manualStop) {
                try { recognition.start(); } catch (e) {}
            } else {
                isListening = false;
                micToggleBtn.classList.remove('active');
                micToggleBtn.textContent = '🎤 เปิดไมค์';
                inputBoxWrapper.classList.remove('listening-border');
                setStatusMessage('ปิดไมโครโฟนแล้ว');
                releaseWakeLock();
            }
        };

        recognition.onerror = (event) => {
            if (event.error !== 'no-speech' && event.error !== 'aborted') {
                setStatusMessage(`ข้อผิดพลาดไมโครโฟน: ${event.error}`);
            }
        };

        document.querySelectorAll('.teach-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const targetKey = chip.getAttribute('data-teach');
                if (!lastHeardRawText) {
                    setStatusMessage('ลองพูดคำที่ต้องการสอนก่อน 1 ครั้ง แล้วค่อยกดปุ่มนี้');
                    return;
                }
                if (targetKey !== 'OUT' && /\d/.test(convertAllThaiNumbers(lastHeardRawText))) {
                    setStatusMessage(`⚠️ ไม่อนุญาตให้จำ "${lastHeardRawText}" เป็น [${targetKey}] เพราะมีตัวเลข`);
                    return;
                }
                const cleaned = cleanCalibratedWord(lastHeardRawText);
                if (!cleaned) {
                    setStatusMessage('⚠️ ไม่พบคำภาษาพูดสำหรับบันทึก');
                    return;
                }
                if (!voiceDict[targetKey].includes(cleaned)) {
                    voiceDict[targetKey].unshift(cleaned);
                    localStorage.setItem('chandy_voice_dict_v4', JSON.stringify(voiceDict));
                    lastTaughtRecord = { key: targetKey, word: cleaned };
                    setStatusMessage(`✅ จำ "${cleaned}" เป็น [${targetKey}]`, true);
                } else {
                    setStatusMessage(`มีคำว่า "${cleaned}" ใน [${targetKey}] อยู่แล้ว`);
                }
            });
        });

        // ==========================================
        // 7. หน้าต่าง Modal คาลิเบรตเสียง
        // ==========================================
        const calModal = document.getElementById('calModal');
        const calRowsContainer = document.getElementById('calRowsContainer');

        function renderCalibrationModal() {
            calRowsContainer.innerHTML = calConfigMeta.map(item => `
                <div class="cal-row">
                    <div class="cal-row-top">
                        <span class="cal-label">${item.title}</span>
                        <button type="button" class="record-cal-btn" data-key="${item.key}">🎙️ พูดเพื่อจำเสียง</button>
                    </div>
                    <input type="text" id="cal_in_${item.key}" class="cal-input" value="${voiceDict[item.key].join(', ')}">
                </div>
            `).join('');

            calRowsContainer.querySelectorAll('.record-cal-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.getAttribute('data-key');
                    if (calibratingTargetKey === key) {
                        calibratingTargetKey = null;
                    } else {
                        calibratingTargetKey = key;
                        if (!isListening) {
                            manualStop = false;
                            try { recognition.start(); } catch(e) {}
                        }
                    }
                    updateCalButtonsUI();
                });
            });
        }

        function updateCalButtonsUI() {
            calRowsContainer.querySelectorAll('.record-cal-btn').forEach(btn => {
                const key = btn.getAttribute('data-key');
                if (calibratingTargetKey === key) {
                    btn.classList.add('recording');
                    btn.textContent = '🔴 พูดได้เลย...';
                } else {
                    btn.classList.remove('recording');
                    btn.textContent = '🎙️ พูดเพื่อจำเสียง';
                }
            });
        }

        function addCalibratedWordToInput(key, word) {
            const inputEl = document.getElementById(`cal_in_${key}`);
            if (!inputEl || !word) return;
            const currentList = inputEl.value.split(',').map(s => s.trim()).filter(Boolean);
            if (!currentList.includes(word)) {
                currentList.unshift(word);
                inputEl.value = currentList.join(', ');
            }
        }

        document.getElementById('openCalBtn').addEventListener('click', () => {
            renderCalibrationModal();
            calModal.classList.add('show');
        });

        document.getElementById('closeCalBtn').addEventListener('click', () => {
            calibratingTargetKey = null;
            calModal.classList.remove('show');
        });

        document.getElementById('saveCalBtn').addEventListener('click', () => {
            const updated = {};
            calConfigMeta.forEach(item => {
                const inputEl = document.getElementById(`cal_in_${item.key}`);
                if (inputEl) {
                    updated[item.key] = inputEl.value.split(',').map(s => s.trim()).filter(Boolean);
                }
            });
            voiceDict = sanitizeDict(updated);
            localStorage.setItem('chandy_voice_dict_v4', JSON.stringify(voiceDict));
            calibratingTargetKey = null;
            calModal.classList.remove('show');
            setStatusMessage('✅ บันทึกค่าคาลิเบรตเรียบร้อยแล้ว');
        });

        document.getElementById('resetCalBtn').addEventListener('click', () => {
            if (confirm('คืนค่าคำศัพท์เริ่มต้นทั้งหมด?')) {
                voiceDict = JSON.parse(JSON.stringify(defaultVoiceDict));
                localStorage.removeItem('chandy_voice_dict_v4');
                renderCalibrationModal();
            }
        });
    }
</script>
</body>
</html>
